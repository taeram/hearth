services:
  flaresolverr:
    environment:
      - LOG_LEVEL=info
    hostname: flaresolverr
    image: ghcr.io/flaresolverr/flaresolverr
    ports:
      - "8191"
    restart: always
  jackett:
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    hostname: jackett
    image: lscr.io/linuxserver/jackett:latest
    ports:
      - "9117"
    restart: always
    volumes:
      - $CONTAINERS_PATH/jackett:/config/Jackett
  lidarr:
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    hostname: lidarr
    image: lscr.io/linuxserver/lidarr:latest
    ports:
      - "8686"
    restart: always
    volumes:
      - $CONTAINERS_PATH/lidarr:/config
      - $CONTAINERS_PATH/qbittorrent/downloads:/downloads
      - $CONTAINERS_PATH/plex/media/Music:/media
  qbittorrent:
    image: binhex/arch-qbittorrentvpn
    cap_add:
      - NET_ADMIN
    environment:
      VPN_ENABLED: "yes"
      VPN_CLIENT: "openvpn"
      VPN_USER: $QBITTORRENT_VPN_USER
      VPN_PASS: $QBITTORRENT_VPN_PASSWORD
      VPN_PROV: $QBITTORRENT_VPN_PROVIDER
      ENABLE_STARTUP_SCRIPTS: "no"
      ENABLE_PRIVOXY: "yes"
      STRICT_PORT_FORWARD: "yes"
      USERSPACE_WIREGUARD: "no"
      ENABLE_SOCKS: "no"
      LAN_NETWORK: 192.168.1.0/24
      NAME_SERVERS: 1.1.1.1,1.0.0.1
      DEBUG: "false"
      UMASK: 000
      WEBUI_PORT: 8085
      PUID: $PUID
      PGID: $PGID
      TZ: $TZ
    hostname: qbittorrent
    ports:
      - "8085:8085"
      - "8118"
      - "9118"
      - "58946"
      - "58946/udp"
    restart: always
    volumes:
      - $CONTAINERS_PATH/qbittorrent/config:/config
      - $CONTAINERS_PATH/qbittorrent/downloads/incomplete:/downloads/incomplete
      - $CONTAINERS_PATH/qbittorrent/downloads/completed:/downloads/completed
      - $CONTAINERS_PATH/qbittorrent/downloads/orphans:/downloads/orphans
      - $CONTAINERS_PATH/qbittorrent/downloads/watched:/downloads/watched
  radarr:
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    hostname: radarr
    image: lscr.io/linuxserver/radarr:latest
    ports:
      - "7878"
    restart: always
    volumes:
      - $CONTAINERS_PATH/radarr:/config
      - $CONTAINERS_PATH/qbittorrent/downloads:/downloads
      - $CONTAINERS_PATH/plex/media:/media
  sonarr:
    environment:
      - PUID=$PUID
      - PGID=$PGID
      - TZ=$TZ
    hostname: sonarr
    image: lscr.io/linuxserver/sonarr:latest
    ports:
      - "8989"
    restart: always
    volumes:
      - $CONTAINERS_PATH/sonarr:/config
      - $CONTAINERS_PATH/qbittorrent/downloads:/downloads
      - $CONTAINERS_PATH/plex/media:/media
  unpackerr:
    image: golift/unpackerr
    hostname: unpackerr
    environment:
      ## Global Settings
      - TZ=${TZ}
      - UN_ACTIVITY=false
      - UN_DEBUG=false
      - UN_DIR_MODE=0755
      - UN_ERROR_STDERR=false
      - UN_FILE_MODE=0644
      - UN_INTERVAL=2m
      - UN_LOG_FILE_MB=10
      - UN_LOG_FILE_MODE=0600
      - UN_LOG_FILE=/config/unpackerr.log
      - UN_LOG_FILES=10
      - UN_LOG_QUEUES=1m
      - UN_MAX_RETRIES=3
      - UN_PARALLEL=1
      - UN_QUIET=false
      - UN_RETRY_DELAY=5m
      - UN_START_DELAY=1m
      ## Web Server
      - UN_WEBSERVER_LISTEN_ADDR=0.0.0.0:5656
      - UN_WEBSERVER_LOG_FILE_MB=10
      - UN_WEBSERVER_LOG_FILE=
      - UN_WEBSERVER_LOG_FILES=10
      - UN_WEBSERVER_METRICS=false
      - UN_WEBSERVER_SSL_CERT_FILE=
      - UN_WEBSERVER_SSL_KEY_FILE=
      - UN_WEBSERVER_UPSTREAMS=
      - UN_WEBSERVER_URLBASE=/
      ## Folder Settings
      - UN_FOLDERS_INTERVAL=1s
      - UN_FOLDERS_BUFFER=20000
      ## Sonarr Settings
      - UN_SONARR_0_API_KEY=$UNPACKERR_SONARR_API_KEY
      - UN_SONARR_0_DELETE_DELAY=1m
      - UN_SONARR_0_DELETE_ORIG=false
      - UN_SONARR_0_PATHS_0=/downloads
      - UN_SONARR_0_PROTOCOLS=torrent
      - UN_SONARR_0_SYNCTHING=false
      - UN_SONARR_0_TIMEOUT=10s
      - UN_SONARR_0_URL=http://sonarr:8989
      ## Radarr Settings
      - UN_RADARR_0_API_KEY=$UNPACKERR_RADARR_API_KEY
      - UN_RADARR_0_DELETE_DELAY=1m
      - UN_RADARR_0_DELETE_ORIG=false
      - UN_RADARR_0_PATHS_0=/downloads
      - UN_RADARR_0_PROTOCOLS=torrent
      - UN_RADARR_0_SYNCTHING=false
      - UN_RADARR_0_TIMEOUT=10s
      - UN_RADARR_0_URL=http://radarr:7878
      ## Lidarr Settings
      - UN_LIDARR_0_API_KEY=$UNPACKERR_LIDARR_API_KEY
      - UN_LIDARR_0_DELETE_DELAY=1m
      - UN_LIDARR_0_DELETE_ORIG=false
      - UN_LIDARR_0_PATHS_0=/downloads
      - UN_LIDARR_0_PROTOCOLS=torrent
      - UN_LIDARR_0_SYNCTHING=false
      - UN_LIDARR_0_TIMEOUT=10s
      - UN_LIDARR_0_URL=http://lidarr:8686
    ports:
      - "5656"
    restart: always
    user: ${PUID}:${PGID}
    volumes:
      - $CONTAINERS_PATH/unpackerr:/config
      - $CONTAINERS_PATH/qbittorrent/downloads:/downloads
